name: SOTS Transcript Scrape
"on":  schedule:    - cron: '0 6 * * 0'  workflow_dispatch:
permissions:  contents: write
jobs:  scrape:    runs-on: ubuntu-latest    steps:      - name: Checkout repo        uses: actions/checkout@v4
      - name: Set up Python        uses: actions/setup-python@v5        with:          python-version: '3.12'
      - name: Install yt-dlp        run: pip install --upgrade yt-dlp
      - name: Scrape transcripts        run: |          mkdir -p transcripts          yt-dlp \            --skip-download \            --write-auto-subs \            --sub-lang en \            --sub-format vtt \            --download-archive transcripts/.archive.txt \            --output "transcripts/%(upload_date)s-%(title)s.%(ext)s" \            --restrict-filenames \            --ignore-errors \            "https://www.youtube.com/@ScienceoftheStrike"
      - name: Commit and push        run: |          git config user.name  "github-actions[bot]"          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"          git add transcripts/          git diff --cached --quiet || git commit -m "Auto-update transcripts $(date -u +%F)"          git push
